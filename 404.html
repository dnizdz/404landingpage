<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found - 404 Advisory</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3FBTWXL6FR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3FBTWXL6FR');
  </script>
  <meta name="description" content="Page not found. Back to 404 Advisory." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/404-logo.png" />
  <style>
    .not-found {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .not-found .code {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(64px, 16vw, 140px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--accent, #26c6f5);
      line-height: 1;
    }
    .not-found h1 {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 600;
    }
    .not-found p {
      color: var(--muted, #9bb0c9);
      max-width: 46ch;
    }
  </style>
</head>
<body style="background:#0b1633;color:#e6f2ff;">
  <main class="not-found">
    <div class="code">404</div>
    <h1>This page went looking for advice and didn't find any.</h1>
    <p>The page you're after doesn't exist, or it moved. Head back and we'll point you the right way.</p>
    <a class="btn" href="/">Back to 404 Advisory</a>
  </main>
  <script src="https://doomsday.404advisory.live/tracking.js"></script>
</body>
